# Mosquitto 2.x — Nexon access control broker

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ── MQTT listener ────────────────────────────────────────────────────────
listener 1883
allow_anonymous true

# ── WebSocket listener ───────────────────────────────────────────────────
listener 9001
protocol websockets
allow_anonymous true

# Topic structure:
#   nexon/doors/{door_id}/status       — door open/locked/alarm
#   nexon/doors/{door_id}/command      — open / lock / alarm
#   nexon/events                       — access events stream
#   nexon/alerts                       — security alerts
#   nexon/presence                     — occupancy updates
