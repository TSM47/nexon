services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexon}
      POSTGRES_USER: ${POSTGRES_USER:-nexon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexon_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexon} -d ${POSTGRES_DB:-nexon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexon_net

  # ── Mosquitto MQTT broker ─────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: nexon_mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"   # MQTT
      - "9001:9001"   # MQTT over WebSocket
    networks:
      - nexon_net

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexon_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexon}:${POSTGRES_PASSWORD:-nexon_secret}@postgres:5432/${POSTGRES_DB:-nexon}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production_32chars_min}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
    networks:
      - nexon_net

  # ── Next.js frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexon_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/api/ws}
    depends_on:
      - backend
    networks:
      - nexon_net

  # ── nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nexon_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./:/usr/share/nginx/html/dashboard:ro
    depends_on:
      - backend
      - frontend
    networks:
      - nexon_net

volumes:
  postgres_data:

networks:
  nexon_net:
    driver: bridge
